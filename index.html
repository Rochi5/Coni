# Coni
Feliz cumple a mi amiga &lt;3
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feliz Cumpleaños Coni</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #fce4ec;
    }
    #juego {
      display: none;
      margin-top: 20px;
    }
    #instrucciones {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>🎉 Feliz Cumpleaños Coni 🎉</h1>
  <p>Inserta tu apodo para comenzar:</p>
  <input type="text" id="apodo" placeholder="Inserta tu apodo">
  <button onclick="verificar()">Enviar</button>

  <audio id="musicaFondo" src="TXT.mp3" loop preload="auto"></audio>

  <div id="mensaje"></div>
  <div id="juego">
    <h2>🎮 Mini Juego 🎮</h2>
    <p id="instrucciones">Usa las flechas del teclado para mover y haz clic en la imagen para ganar puntos.</p>
    <img id="imagenJuego" src="Coni.png" alt="Coni" width="200" onclick="sumarPuntos()">
    <p>Puntos: <span id="puntos">0</span></p>
    <button onclick="reiniciarJuego()">🔄 Reintentar</button>
  </div>

  <script>
    function verificar() {
      const apodo = document.getElementById("apodo").value.trim();
      if (apodo === "Coni") {
        document.getElementById("mensaje").innerHTML = "💖 ¡Feliz cumple Coni! 💖";
        document.getElementById("juego").style.display = "block";
        const musica = document.getElementById("musicaFondo");
        musica.play().then(() => {
          console.log("La música empezó correctamente");
        }).catch(error => {
          console.log("El navegador bloqueó la música:", error);
        });
      } else {
        document.getElementById("mensaje").innerHTML = "Ese no es el apodo correcto 😅";
      }
    }

    let puntos = 0;
    function sumarPuntos() {
      puntos++;
      document.getElementById("puntos").innerText = puntos;
    }

    function reiniciarJuego() {
      puntos = 0;
      document.getElementById("puntos").innerText = puntos;
      document.getElementById("mensaje").innerHTML = "Juego reiniciado 🎮";
    }
  </script>
</body>
</html>
